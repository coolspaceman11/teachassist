name: Build TeachAssist+ iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout TeachAssist+
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install iOS CocoaPods
        working-directory: ios
        run: pod install

      - name: Find TeachAssist+ Xcode project
        id: ios
        shell: bash
        run: |
          echo "Contents of ios:"
          ls -la ios

          PROJECT=$(find ios \
            -maxdepth 1 \
            -name "*.xcodeproj" \
            ! -name "Pods.xcodeproj" \
            -print -quit)

          WORKSPACE=$(find ios \
            -maxdepth 1 \
            -name "*.xcworkspace" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Main Xcode project not found."
            exit 1
          fi

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: Xcode workspace not found."
            exit 1
          fi

          SCHEME=$(basename "$PROJECT" .xcodeproj)

          echo "Project: $PROJECT"
          echo "Workspace: $WORKSPACE"
          echo "App scheme: $SCHEME"

          echo "Available schemes:"
          xcodebuild -workspace "$WORKSPACE" -list

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          echo "Building scheme: ${{ steps.ios.outputs.scheme }}"

          xcodebuild \
            -workspace "${{ steps.ios.outputs.workspace }}" \
            -scheme "${{ steps.ios.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/ios/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Locate built iPhone application
        id: app
        shell: bash
        run: |
          echo "Searching build output for .app bundles..."

          find "$GITHUB_WORKSPACE/ios/build" \
            -type d \
            -name "*.app" \
            -print || true

          APP=$(find "$GITHUB_WORKSPACE/ios/build/Build/Products" \
            -type d \
            -name "*.app" \
            -print \
            -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle exists in the Xcode build products."
            echo "Build products:"
            find "$GITHUB_WORKSPACE/ios/build/Build/Products" \
              -maxdepth 4 \
              -print || true
            exit 1
          fi

          echo "Found application:"
          echo "$APP"

          echo "app_path=$APP" >> "$GITHUB_OUTPUT"

      - name: Package TeachAssist+ IPA
        shell: bash
        run: |
          APP="${{ steps.app.outputs.app_path }}"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          /usr/bin/zip -qry TeachAssistPlus.ipa Payload

          echo "Created IPA:"
          ls -lh TeachAssistPlus.ipa

      - name: Upload TeachAssist+ IPA
        uses: actions/upload-artifact@v4
        with:
          name: TeachAssistPlus-iOS
          path: TeachAssistPlus.ipa
          if-no-files-found: error